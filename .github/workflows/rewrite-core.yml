name: Rewrite Core

on:
  push:
    branches:
      - feature/desktop-core-integration
  pull_request:
    branches:
      - upstream-rewrite
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Check formatting
        run: |
          rustfmt --edition 2021 --config skip_children=true --check src/conversion-server/src/main.rs
          rustfmt --edition 2021 --check src/conversion-server/src/engine_worker.rs src/conversion-server/src/swift_engine.rs

      - name: Test conversion server
        run: cargo test -p conversion-server

      - name: Check TSF core
        run: cargo check -p tsf-core
