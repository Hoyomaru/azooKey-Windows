name: Rewrite Core

on:
  push:
    branches:
      - feature/desktop-core-integration
      - feature/shared-engine-integration
      - feature/tsf-session-state
  pull_request:
    branches:
      - upstream-rewrite
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Check formatting
        run: |
          rustfmt --edition 2021 --config skip_children=true --check src/conversion-server/src/main.rs
          rustfmt --edition 2021 --check src/conversion-server/src/engine_worker.rs src/conversion-server/src/swift_engine.rs

      - name: Test conversion server
        run: cargo test -p conversion-server

      - name: Check TSF core
        run: cargo check -p tsf-core

  swift-dll-smoke:
    name: Swift DLL roundtrip
    runs-on: windows-2022
    steps:
      - name: Checkout Windows integration
        uses: actions/checkout@v4

      - name: Checkout Desktop engine
        uses: actions/checkout@v4
        with:
          repository: Hoyomaru/azooKey-Desktop
          ref: feature/shared-converter-engine
          path: d

      - name: Enable long Git paths
        run: git config --global core.longpaths true

      - name: Setup Swift 6.1
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.1-release
          tag: 6.1-RELEASE

      - name: Build Swift desktop engine DLL
        run: swift build -c release --package-path d/Core --product AzooKeyDesktopEngine

      - name: Locate Swift desktop engine DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem d\Core\.build -Recurse -Filter AzooKeyDesktopEngine.dll | Select-Object -First 1
          if (-not $dll) { throw "AzooKeyDesktopEngine.dll was not produced" }
          "AZOOKEY_DESKTOP_ENGINE_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Run Swift DLL roundtrip
        timeout-minutes: 8
        run: cargo test -p conversion-server swift_engine_dll_roundtrip -- --ignored --nocapture
