name: Rewrite Core

on:
  push:
    branches:
      - feature/desktop-core-integration
  pull_request:
    branches:
      - upstream-rewrite
  workflow_dispatch:

jobs:
  rust-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test conversion server
        run: cargo test -p conversion-server

      - name: Check TSF core
        run: cargo check -p tsf-core
